<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}{{ source_name }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</head>
<body>
<header class="top">
  <a class="brand" href="{{ url_for('index') }}">{{ source_name }}</a>
  <nav>
    {% if session.get('admin') %}
      <a href="{{ url_for('dashboard') }}">Admin</a>
      <form method="post" action="{{ url_for('logout') }}" class="inline">
        <input type="hidden" name="csrf" value="{{ csrf_token() }}">
        <button class="link">Déconnexion</button>
      </form>
    {% else %}
      <a href="{{ url_for('login') }}">Admin</a>
    {% endif %}
  </nav>
</header>
<main>
  {% for category, message in get_flashed_messages(with_categories=true) %}
    <p class="flash {{ category }}">{{ message }}</p>
  {% endfor %}
  {% block body %}{% endblock %}
</main>
</body>
</html>
