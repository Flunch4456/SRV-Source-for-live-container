name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Tests unitaires (pytest)
        run: |
          pip install -r requirements-dev.txt
          pytest -q

      - uses: docker/setup-buildx-action@v3

      - name: Build de l'image (sans publication)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ipa-server:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (catalogue, panel admin, import, source.json, redemarrage)
        run: bash scripts/smoke-test.sh ipa-server:test
