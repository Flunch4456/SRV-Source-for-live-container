name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build de l'image (sans publication)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ipa-server:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (upload, source.json, telechargement)
        run: bash scripts/smoke-test.sh ipa-server:test
