name: Release

# Se declenche quand on pousse un tag de version : git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # creer la release
  packages: write   # publier l'image sur ghcr.io

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # On teste avant de publier : une release cassee ne doit pas partir
      - uses: docker/setup-buildx-action@v3
      - name: Build + smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ipa-server:test
      - run: bash scripts/smoke-test.sh ipa-server:test

      - uses: docker/setup-qemu-action@v3   # pour construire aussi l'image arm64

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags et labels de l'image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build + publication (amd64 et arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Archive du projet pour la release
        run: |
          git archive --format=zip --prefix=srv-source-for-live-container-${{ github.ref_name }}/ \
            -o srv-source-for-live-container-${{ github.ref_name }}.zip HEAD

      - name: Creation de la release GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            "srv-source-for-live-container-${TAG}.zip" \
            --title "$TAG" \
            --generate-notes \
            --notes "Image Docker : \`docker pull ${IMAGE}:${TAG#v}\`"
